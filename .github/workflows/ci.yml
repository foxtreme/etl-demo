name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: github_etl
          POSTGRES_USER: etl_user
          POSTGRES_PASSWORD: etl_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U etl_user -d github_etl"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      DATABASE_URL: postgresql+psycopg://etl_user:etl_password@localhost:5432/github_etl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests
        run: python -m pytest

      - name: Run ETL container
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yaml up --build --abort-on-container-exit --exit-code-from etl
